<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celestial Image Gallery</title>
<style>
:root{--bg:#171326;--panel:#211b35;--accent:#b99ae8;--text:#f3edff;--muted:#b8adc9;--line:color-mix(in srgb,var(--accent) 38%,transparent)}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;transition:background .2s,color .2s}
.wrap{max-width:980px;margin:auto}.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 12px 35px #0002}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}h1{font-size:1.2rem;margin:5px 0}
button,.upload{border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 13px;border-radius:999px;cursor:pointer;font:inherit;font-size:.85rem}button:hover,.upload:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar button.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}.tile{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:color-mix(in srgb,var(--panel) 65%,var(--bg))}.tile img{display:block;width:100%;height:170px;object-fit:cover}.tile .meta{padding:10px}.caption{font-size:.9rem;overflow-wrap:anywhere}.category{font-size:.72rem;color:var(--muted);margin-top:4px}.remove{margin-top:8px;padding:5px 9px;font-size:.75rem}
.empty{text-align:center;color:var(--muted);padding:40px 10px;border:1px dashed var(--line);border-radius:15px}
.add{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.add input[type=text],.add select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}.add input[type=text]{flex:1;min-width:140px}.add select{max-width:150px}.add input[type=file]{display:none}
details{border-top:1px solid var(--line);padding-top:14px;margin-top:18px}summary{cursor:pointer;color:var(--accent);font-weight:600}.pickers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.pickers label{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);background:color-mix(in srgb,var(--panel) 70%,var(--bg));padding:9px 11px;border-radius:12px;font-size:.85rem}.pickers input{width:38px;height:30px;border:0;background:transparent;padding:0;cursor:pointer}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.note{font-size:.72rem;color:var(--muted);margin-top:12px}
@media(max-width:430px){body{padding:10px}.panel{padding:15px}.pickers{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap"><main class="panel">
<header><div><div class="eyebrow">The inspiration gallery</div><h1>Collected fragments</h1></div><label class="upload" for="files">＋ Add images</label><input id="files" type="file" accept="image/*" multiple></header>
<div class="add"><input id="caption" type="text" placeholder="Image caption (optional)"><select id="category"><option>Realities</option><option>Characters</option><option>Aesthetics</option><option>Places</option><option>Other</option></select></div>
<div class="toolbar" id="filters"></div><div id="gallery" class="grid"></div>
<details><summary>Customise colours</summary><div class="pickers">
<label>Background <input type="color" data-var="bg" value="#171326"></label><label>Card <input type="color" data-var="panel" value="#211b35"></label><label>Accent <input type="color" data-var="accent" value="#b99ae8"></label><label>Text <input type="color" data-var="text" value="#f3edff"></label>
</div><div class="actions"><button id="reset">Reset colours</button><button id="save">Save colours</button></div></details>
<div class="note">Images are saved in this browser on this device. Keep your original copies elsewhere.</div>
</main></div>
<script>
const defaults={bg:"#171326",panel:"#211b35",accent:"#b99ae8",text:"#f3edff"},root=document.documentElement;
let theme={...defaults};try{theme={...defaults,...JSON.parse(localStorage.getItem("celestial-gallery-theme")||"{}")}}catch{}
function applyTheme(){Object.entries(defaults).forEach(([k,v])=>root.style.setProperty("--"+k,theme[k]||v));document.querySelectorAll("[data-var]").forEach(i=>i.value=theme[i.dataset.var]||defaults[i.dataset.var])}
applyTheme();document.querySelectorAll("[data-var]").forEach(i=>i.addEventListener("input",()=>{theme[i.dataset.var]=i.value;root.style.setProperty("--"+i.dataset.var,i.value)}));
document.getElementById("save").onclick=()=>localStorage.setItem("celestial-gallery-theme",JSON.stringify(theme));
document.getElementById("reset").onclick=()=>{theme={...defaults};applyTheme();localStorage.setItem("celestial-gallery-theme",JSON.stringify(theme))};
const DB="celestial-image-gallery-v2",STORE="images";let db,items=[],filter="All";
function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function request(mode,fn){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,mode),store=tx.objectStore(STORE),req=fn(store);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function refresh(){items=await request("readonly",s=>s.getAll());render()}
const categories=["All","Realities","Characters","Aesthetics","Places","Other"];
function renderFilters(){const el=document.getElementById("filters");el.innerHTML="";categories.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.className=filter===c?"active":"";b.onclick=()=>{filter=c;render()};el.append(b)})}
function render(){renderFilters();const el=document.getElementById("gallery");el.innerHTML="";const shown=items.filter(x=>filter==="All"||x.category===filter);if(!shown.length){el.className="";el.innerHTML='<div class="empty">Your gallery is waiting for its first image.</div>';return}el.className="grid";shown.forEach(item=>{const tile=document.createElement("article");tile.className="tile";const img=document.createElement("img");img.src=URL.createObjectURL(item.blob);img.alt=item.caption||item.category;const meta=document.createElement("div");meta.className="meta";const cap=document.createElement("div");cap.className="caption";cap.textContent=item.caption||"Untitled";const cat=document.createElement("div");cat.className="category";cat.textContent=item.category;const del=document.createElement("button");del.className="remove";del.textContent="Remove";del.onclick=async()=>{await request("readwrite",s=>s.delete(item.id));refresh()};meta.append(cap,cat,del);tile.append(img,meta);el.append(tile)})}
document.getElementById("files").addEventListener("change",async e=>{for(const file of e.target.files){if(!file.type.startsWith("image/"))continue;await request("readwrite",s=>s.add({blob:file,caption:document.getElementById("caption").value.trim(),category:document.getElementById("category").value,created:Date.now()}))}e.target.value="";document.getElementById("caption").value="";await refresh()});
openDB().then(async x=>{db=x;await refresh()}).catch(()=>{document.getElementById("gallery").innerHTML='<div class="empty">Your browser could not open local image storage. Try a current version of Chrome or Firefox.</div>'});
</script></body></html>
