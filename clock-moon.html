<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celestial Clock & Moon</title>
<style>
:root{--bg:#171326;--panel:#211b35;--accent:#b99ae8;--text:#f3edff;--muted:#b8adc9;--moon:#e8dcff;--line:color-mix(in srgb,var(--accent) 38%,transparent)}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;transition:background .2s,color .2s}
.wrap{max-width:680px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 35px #0002}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{color:var(--muted);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase}
h1{font-size:1.12rem;margin:5px 0 0;font-weight:650}
.clock{text-align:center;font-size:clamp(2.8rem,10vw,4.6rem);font-weight:650;letter-spacing:.04em;margin:24px 0 2px;font-variant-numeric:tabular-nums}
.date{text-align:center;color:var(--muted);font-size:.9rem}
.moon-area{display:flex;align-items:center;justify-content:center;gap:24px;margin:26px auto 10px;flex-wrap:wrap}
.moon-svg{width:112px;height:112px;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--moon) 30%,transparent))}
.moon-title{font-size:1.25rem;font-weight:650;margin-bottom:6px}
.details{color:var(--muted);font-size:.9rem;line-height:1.7}
.controls{margin-top:20px;border-top:1px solid var(--line);padding-top:15px}
summary{cursor:pointer;color:var(--accent);font-weight:600}
.pickers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:.85rem;background:color-mix(in srgb,var(--panel) 70%,var(--bg));padding:9px 11px;border-radius:12px}
input[type=color]{width:38px;height:30px;border:0;background:transparent;padding:0;cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:8px 13px;cursor:pointer}
button:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.note{text-align:center;color:var(--muted);font-size:.72rem;margin-top:14px}
@media(max-width:420px){body{padding:10px}.card{padding:17px}.pickers{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
  <div class="top"><div><div class="eyebrow">The celestial desk</div><h1>Time beneath the same moon</h1></div><div class="eyebrow">Europe / London</div></div>
  <div class="clock" id="clock">--:--:--</div><div class="date" id="date">Loading date…</div>
  <div class="moon-area">
    <svg class="moon-svg" viewBox="0 0 120 120" role="img" aria-label="Illustration of the current moon phase">
      <defs><clipPath id="moonClip"><circle cx="60" cy="60" r="43"/></clipPath></defs>
      <circle cx="60" cy="60" r="43" fill="var(--moon)" opacity=".18"/>
      <g clip-path="url(#moonClip)"><circle cx="60" cy="60" r="43" fill="var(--moon)"/><path id="shadow" d="" fill="var(--bg)"/></g>
      <circle cx="60" cy="60" r="43" fill="none" stroke="var(--accent)" stroke-opacity=".55"/>
    </svg>
    <div><div class="moon-title" id="phase">Calculating moon phase…</div><div class="details" id="moonDetails">Approximate lunar information</div></div>
  </div>
  <div class="controls"><details><summary>Customise colours</summary>
    <div class="pickers">
      <label>Background <input type="color" data-var="bg" value="#171326"></label>
      <label>Card <input type="color" data-var="panel" value="#211b35"></label>
      <label>Accent <input type="color" data-var="accent" value="#b99ae8"></label>
      <label>Text <input type="color" data-var="text" value="#f3edff"></label>
      <label>Moon <input type="color" data-var="moon" value="#e8dcff"></label>
    </div><div class="actions"><button id="reset">Reset colours</button><button id="save">Save colours</button></div>
  </details></div>
  <div class="note">Moon phase and illumination are approximate.</div>
</main></div>
<script>
const defaults={bg:"#171326",panel:"#211b35",accent:"#b99ae8",text:"#f3edff",moon:"#e8dcff"};
const root=document.documentElement;
function applyTheme(theme){Object.entries(defaults).forEach(([k,v])=>root.style.setProperty("--"+k,theme[k]||v));document.querySelectorAll("[data-var]").forEach(i=>i.value=theme[i.dataset.var]||defaults[i.dataset.var]);}
let theme={...defaults};try{theme={...defaults,...JSON.parse(localStorage.getItem("celestial-clock-theme")||"{}")}}catch{}
applyTheme(theme);
document.querySelectorAll("[data-var]").forEach(i=>i.addEventListener("input",()=>{theme[i.dataset.var]=i.value;root.style.setProperty("--"+i.dataset.var,i.value)}));
document.getElementById("save").onclick=()=>{localStorage.setItem("celestial-clock-theme",JSON.stringify(theme));};
document.getElementById("reset").onclick=()=>{theme={...defaults};applyTheme(theme);localStorage.setItem("celestial-clock-theme",JSON.stringify(theme));};
function tick(){const now=new Date();document.getElementById("clock").textContent=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(now);document.getElementById("date").textContent=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/London",weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(now);}
tick();setInterval(tick,1000);
function moonInfo(date){
 const synodic=29.530588853, knownNew=Date.UTC(2000,0,6,18,14), days=(date.getTime()-knownNew)/86400000;
 const age=((days%synodic)+synodic)%synodic, illumination=(1-Math.cos(2*Math.PI*age/synodic))/2;
 const names=["New Moon","Waxing Crescent","First Quarter","Waxing Gibbous","Full Moon","Waning Gibbous","Last Quarter","Waning Crescent"];
 const phaseIndex=Math.floor(((age/synodic)*8)+.5)%8;
 const waxing=age<synodic/2, x=60+Math.cos(2*Math.PI*age/synodic)*43;
 // Approximate illuminated limb shape: a smooth terminator ellipse.
 let d;
 if(age<synodic/2){d=`M60 17 A43 43 0 0 1 60 103 A${Math.abs(43*Math.cos(2*Math.PI*age/synodic))} 43 0 0 ${waxing?1:0} 60 17 Z`;}
 else{d=`M60 17 A43 43 0 0 0 60 103 A${Math.abs(43*Math.cos(2*Math.PI*age/synodic))} 43 0 0 ${waxing?0:1} 60 17 Z`;}
 document.getElementById("shadow").setAttribute("d",d);
 document.getElementById("phase").textContent=names[phaseIndex];
 document.getElementById("moonDetails").innerHTML=`About ${Math.round(illumination*100)}% illuminated<br>Lunar age: ${age.toFixed(1)} days`;
}
moonInfo(new Date());
</script>
</body></html>
